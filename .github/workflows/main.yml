name: Build Android Kernel SM8250

on:
  workflow_dispatch: # 允许手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex glibc-source libelf-dev libssl-dev libio-pty-perl git nano visualvm cpio libncurses5-dev libncursesw5-dev xz-utils
   
    - name: Download Proton Clang Toolchain
      run: |
        URL=$(echo "aHR0cHM6Ly9naXRodWIuY29tL2tkcmFnMG4vcHJvdG9uLWNsYW5nLmdpdA==" | base64 -d)
        git clone --depth=1 "$URL" $GITHUB_WORKSPACE/clang-bin
        echo "$GITHUB_WORKSPACE/clang-bin/bin" >> $GITHUB_PATH

    - name: Setup Build Environment Variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    - name: Run Build
      run: |
        # 1. 自动寻找最正确的 OPLUS/Realme 配置文件
        # 优先寻找名字里带有 oplus, oppo 或 rmx 的特定配置
        if [ -f "arch/arm64/configs/vendor/oplus_kona_defconfig" ]; then
          DEFCONFIG="vendor/oplus_kona_defconfig"
        elif [ -f "arch/arm64/configs/vendor/rmx3366_defconfig" ]; then
          DEFCONFIG="vendor/rmx3366_defconfig"
        elif [ -f "arch/arm64/configs/vendor/kona-perf_defconfig" ]; then
          DEFCONFIG="vendor/kona-perf_defconfig"
        else
          DEFCONFIG="vendor/$(ls arch/arm64/configs/vendor/ | head -n 1)"
        fi
        echo "Selected Defconfig: $DEFCONFIG"

        # 2. 修复电源驱动代码中的 Clang 类型冲突（保留之前的修复）
        if [ -f "drivers/power/supply/qcom/schgm-flash.h" ]; then
          sed -i '1s/^/struct smb_charger;\n/' drivers/power/supply/qcom/schgm-flash.h
        fi
        if [ -f "drivers/power/supply/qcom/schgm-flash.c" ]; then
          sed -i 's/#include "schgm-flash.h"/#include "smb5-lib.h"\n#include "schgm-flash.h"/' drivers/power/supply/qcom/schgm-flash.c
        fi

        # 3. 生成基础内核配置
        make O=out $DEFCONFIG CC=clang

        # 4. 强制追加 OPLUS 驱动宏定义（防止链接阶段缺失 VOOC 闪充和板级符号）
        # 很多第三方仓库需要手动把 oplus 的扩展配置追加入 .config
        if [ -f "arch/arm64/configs/vendor/oplus.config" ]; then
          echo "Merging oplus.config..."
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/oplus.config
        fi

        # 强制在配置文件末尾写入核心宏，兜底缺失的符号
        echo "CONFIG_OPLUS_CHG=y" >> out/.config
        echo "CONFIG_OPLUS_CHG_VOOC=y" >> out/.config
        echo "CONFIG_OPLUS_BOARD_INFO=y" >> out/.config
        
        # 刷新配置文件以使手动追加的宏生效
        make O=out olddefconfig CC=clang

        # 5. 开始全核链接编译
        make -j$(nproc --all) O=out CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error"

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Image
        path: out/arch/arm64/boot/Image
