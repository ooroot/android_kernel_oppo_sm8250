name: Build Android Kernel SM8250

on:
  workflow_dispatch: # 允许手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex glibc-source libelf-dev libssl-dev libio-pty-perl git nano visualvm cpio libncurses5-dev libncursesw5-dev xz-utils

    - name: Download Proton Clang Toolchain
      run: |
        # 使用 git 极速克隆专为 Android 内核优化的库（仅克隆最近一次提交，体积小、速度快）
        git clone --depth=1 https://github.com clang-bin
        # 将 Clang 的 bin 目录直接注入到 GitHub Actions 的环境变量中
        echo "$(pwd)/clang-bin/bin" >> $GITHUB_PATH

    - name: Setup Build Environment Variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    - name: Run Build
      run: |
        # 1. 生成配置文件（请确认仓库中是否存在该 defconfig，或根据实际文件修改）
        make O=out vendor/stock_defconfig
        
        # 2. 开始编译（使用 Clang 编译器）
        make -j$(nproc --all) O=out CC=clang

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Image
        path: out/arch/arm64/boot/Image
